<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratación · Teodoro</title>
<style>
:root{
  --ink:#0a0f1e; --ink2:#0f172a; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.11); --txt:#e7ecf6; --soft:#a3aec4; --mute:#6f7b93;
  --gold:#f59e0b; --blue:#2563eb; --cyan:#06b6d4; --ok:#22c55e; --bad:#f43f5e; --warn:#f59e0b;
  --okbg:rgba(34,197,94,.14); --badbg:rgba(244,63,94,.14); --warnbg:rgba(245,158,11,.14); --infobg:rgba(6,182,212,.14);
  --head:'Syne','Segoe UI',system-ui,sans-serif; --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:12px; --sombra:0 10px 30px rgba(0,0,0,.35);
}
html.tema-claro{
  --ink:#e8dfc8; --ink2:#efe7d4; --panel:#fbf7ee; --panel2:#f3ecdc; --line:rgba(70,51,31,.18);
  --txt:#2b1f12; --soft:#5f4c36; --mute:#8a7559; --gold:#a66a00; --blue:#46331f; --cyan:#a68b69;
  --okbg:rgba(34,140,70,.14); --badbg:rgba(190,30,60,.12); --warnbg:rgba(190,120,0,.14); --infobg:rgba(166,139,105,.2);
  --sombra:0 8px 22px rgba(70,51,31,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--txt);font:14px/1.5 var(--body)}
.bg-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/22px 22px,
  radial-gradient(1200px 600px at 85% -10%,rgba(37,99,235,.18),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(6,182,212,.12),transparent 60%)}
html.tema-claro .bg-layer{background:radial-gradient(circle at 1px 1px,rgba(70,51,31,.10) 1px,transparent 0) 0 0/22px 22px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.oculto{display:none!important}
.mute{color:var(--soft)} .peq{font-size:12.5px}

/* ---------- botones / campos ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);
  padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--panel)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;color:#fff;font-weight:600}
html.tema-claro .btn-p{background:var(--blue)}
.btn-g{border-color:var(--gold);color:var(--gold);background:transparent}
.btn-ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.btn-bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.btn-s{padding:4px 9px;font-size:12.5px;border-radius:7px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--soft)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
html.tema-claro input,html.tema-claro select,html.tema-claro textarea{background:#fff}
textarea{resize:vertical;min-height:80px}
select option{background:var(--ink2);color:var(--txt)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2} .span3{grid-column:span 3} .spanall{grid-column:1/-1}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}

/* ---------- estructura ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 22px;
  background:rgba(10,15,30,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
html.tema-claro .top{background:#46331f;color:#f6efe0}
html.tema-claro .top .btn{color:#f6efe0;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
html.tema-claro .top select{background:rgba(255,255,255,.12);color:#f6efe0;border-color:rgba(255,255,255,.25)}
.marca{font-family:var(--head);font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
.marca b{color:var(--gold)} html.tema-claro .marca b{color:#e8c48a}
.top .esp{flex:1}
.top select{width:auto;padding:5px 8px}
.quien{font-size:12.5px;opacity:.85;text-align:right;line-height:1.25}
nav.tabs{display:flex;gap:4px;padding:10px 22px 0;flex-wrap:wrap}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--soft);font-weight:600}
nav.tabs button.on{color:var(--txt);border-color:var(--gold)}
nav.tabs .n{background:var(--badbg);color:var(--bad);border-radius:20px;padding:0 7px;font-size:11.5px;margin-left:5px}
main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px)}
html.tema-claro .card{box-shadow:var(--sombra)}
.fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fila.entre{justify-content:space-between}
.sep{height:14px}

/* ---------- río de etapas (tablero) ---------- */
.rio{display:grid;grid-template-columns:repeat(10,minmax(92px,1fr));gap:0;overflow-x:auto;padding:6px 0 4px}
.rio .et{position:relative;padding:14px 10px 12px;cursor:pointer;border-radius:10px;text-align:left;background:none;border:none}
.rio .et:hover{background:var(--panel2)}
.rio .et::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.rio .et.lleno::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
html.tema-claro .rio .et.lleno::before{background:var(--cyan)}
.rio .num{font-family:var(--head);font-size:34px;font-weight:700;line-height:1}
.rio .et.vacio .num{color:var(--mute)}
.rio .nom{font-size:12.5px;color:var(--soft);margin-top:6px;line-height:1.25}
.rio .dias{font-size:11.5px;color:var(--mute);margin-top:4px}
.rio .dias.alerta{color:var(--bad)}

/* ---------- tablas / chips ---------- */
.tabla-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--soft);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;white-space:nowrap}
html.tema-claro table.t th{background:#a68b69;color:#fff}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:var(--panel2)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)} .c-bad{background:var(--badbg);color:var(--bad)}
.c-warn{background:var(--warnbg);color:var(--warn)} .c-info{background:var(--infobg);color:var(--cyan)}
.c-gris{background:var(--panel2);color:var(--soft)}
.barra{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:90px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
html.tema-claro .barra i{background:var(--cyan)}
.nombre{font-weight:600} .sub{font-size:12px;color:var(--soft)}

/* ---------- stepper del contrato ---------- */
.pasos{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px}
.paso{flex:1;min-width:86px;position:relative;padding-top:20px;font-size:11.5px;color:var(--mute);text-align:center;background:none;border:none}
.paso::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.paso::after{content:"";position:absolute;top:2px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink2);border:2px solid var(--line)}
.paso.hecho{color:var(--soft)} .paso.hecho::before{background:var(--cyan)} .paso.hecho::after{background:var(--cyan);border-color:var(--cyan)}
.paso.actual{color:var(--txt);font-weight:700} .paso.actual::before{background:linear-gradient(90deg,var(--cyan),var(--line))}
.paso.actual::after{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.25)}
button.paso{cursor:pointer} button.paso:hover{color:var(--txt)}

/* ---------- modal / toast ---------- */
.velo{position:fixed;inset:0;background:rgba(3,6,15,.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{background:var(--ink2);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);box-shadow:var(--sombra);animation:entra .18s ease-out}
html.tema-claro .modal{background:#f7f1e3}
.modal.chico{width:min(480px,100%)}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 20px 20px}
.cerrar{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--soft);line-height:1}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -20px 16px;padding:0 20px;overflow-x:auto}
.subtabs button{background:none;border:none;padding:9px 12px;cursor:pointer;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--txt);border-color:var(--cyan);font-weight:600}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;box-shadow:var(--sombra);font-size:13.5px}
.tst.err{border-color:var(--bad);color:var(--bad)} .tst.ok{border-color:var(--ok)}
.cargando{opacity:.6;pointer-events:none}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:min(400px,100%);padding:28px}
#login h1{font-size:28px;margin-bottom:4px}
.lista-gen{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gen{text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.gen:hover{border-color:var(--cyan)}
.gen b{display:block;font-family:var(--head);margin-bottom:3px}
.obs{background:var(--badbg);color:var(--bad);padding:6px 10px;border-radius:8px;font-size:12.5px;margin-top:4px}
.aviso{background:var(--infobg);border-radius:10px;padding:10px 14px;font-size:13.5px}
.vacio-msg{padding:30px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div class="bg-layer"></div>

<!-- ============ LOGIN ============ -->
<section id="login" class="oculto">
  <div class="card">
    <div class="marca" style="margin-bottom:18px">Teodoro <b>Contratación</b></div>
    <h1>Entrar</h1>
    <p class="mute" style="margin:0 0 18px">Usa el mismo correo y contraseña con que entras a Teodoro.</p>
    <div class="grid">
      <label class="f">Correo<input id="lg-email" type="email" autocomplete="username"></label>
      <label class="f">Contraseña<input id="lg-pass" type="password" autocomplete="current-password"></label>
      <button class="btn btn-p" id="lg-btn" onclick="entrar()">Entrar</button>
      <button class="btn" style="justify-content:center" onclick="recuperar()">Olvidé mi contraseña</button>
      <div id="lg-msg" class="peq"></div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="oculto">
  <header class="top">
    <a href="home.html" class="marca" style="text-decoration:none;color:inherit">Teodoro <b>Contratación</b></a>
    <span class="esp"></span>
    <select id="sel-vig" onchange="cambiarVigencia(this.value)" aria-label="Vigencia"></select>
    <button class="btn btn-s" onclick="recargar()" title="Actualizar datos">⟳ Actualizar</button>
    <button class="btn btn-s" onclick="alternarTema()" title="Modo claro / oscuro">🌓</button>
    <div class="quien"><div id="q-nombre"></div><div id="q-rol" class="mute"></div></div>
    <button class="btn btn-s" onclick="salir()">Salir</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="vista"></main>
</section>

<div id="capa"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — reemplazar con los datos del proyecto "Cobro coactivo"
   ===================================================================== */
const CFG = {
  URL: 'https://bmurdtfztsltcgwsfbgf.supabase.co/rest/v1/',
  KEY: 'sb_publishable_x3Mu7phCEfpJMcKSQYkf8Q_obSOAvfL',
  BUCKET: 'contratacion',
  ENTIDAD: 'MUNICIPIO DE BELLO',
  NIT: '890.980.112-1',
  DEPENDENCIA: 'Dirección Administrativa de Ejecuciones Fiscales',
  ORDENADOR: { nombre: 'JUAN PABLO GÓMEZ LONDOÑO', cargo: 'Director Administrativo de Ejecuciones Fiscales' },
  DIAS_ALERTA: 5,          // días en una misma etapa antes de marcarlo como atascado
  MAX_MB: 10
};

const ETAPAS = [
  ['documentos','Recolección de documentos','Sube los documentos que aparecen como faltantes o devueltos.'],
  ['revision','Revisión jurídica','El equipo está revisando tus documentos.'],
  ['estudios','Estudios previos','Se están elaborando los estudios previos de tu contrato.'],
  ['cdp','CDP','Se está expidiendo la disponibilidad presupuestal.'],
  ['minuta','Minuta y firma','Tu contrato está listo para firma.'],
  ['rp','Registro presupuestal','Se está expidiendo el registro presupuestal.'],
  ['garantias','Pólizas y ARL','Se está verificando la afiliación a ARL y garantías, si aplican.'],
  ['acta','Acta de inicio','Pronto se firma el acta de inicio.'],
  ['ejecucion','En ejecución','Tu contrato está en ejecución. Radica aquí tus informes mensuales.'],
  ['terminado','Terminado','El contrato terminó.']
];
const IDX = Object.fromEntries(ETAPAS.map((e,i)=>[e[0],i]));
const PERFILES = {profesional:'Prestación de servicios profesionales', tecnico:'Prestación de servicios técnicos', apoyo:'Prestación de servicios de apoyo a la gestión'};
const EST_INF = {borrador:['Borrador','c-gris'],radicado:['Radicado','c-info'],devuelto:['Devuelto','c-bad'],aprobado:['Aprobado','c-ok'],pagado:['Pagado','c-ok']};

/* ============================ ESTADO ============================ */
const S = { perfil:null, rol:null, requisitos:[], contratos:[], documentos:[], informes:[],
            vigencia: Number(localStorage.getItem('teo_ctr_vigencia')) || new Date().getFullYear(),
            tab:'tablero', filtroEtapa:'', busca:'', sel:new Set(), detalle:null, subtab:'resumen', portalId:null, portalTab:'docs' };
let SES = null; try{ SES = JSON.parse(localStorage.getItem('teo_ctr_sesion')||'null'); }catch(e){}

/* ============================ UTILIDADES ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop = n => '$' + Math.round(Number(n)||0).toLocaleString('es-CO');
const hoyISO = () => new Date().toISOString().slice(0,10);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fecha(d){ if(!d) return '—'; const x = new Date(String(d).length===10 ? d+'T12:00:00' : d); return isNaN(x) ? '—' : x.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
function fechaLarga(d){ if(!d) return '____ de __________ de ____'; const x=new Date(d+'T12:00:00'); return `${x.getDate()} de ${MESES[x.getMonth()]} de ${x.getFullYear()}`; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/864e5); }
function sumarMeses(iso, meses){
  if(!iso || !meses) return null;
  const d = new Date(iso+'T12:00:00'); const ent = Math.floor(meses); const dias = Math.round((meses-ent)*30);
  d.setMonth(d.getMonth()+ent); d.setDate(d.getDate()+dias-1); return d.toISOString().slice(0,10);
}
function toast(msg, tipo=''){ const t=document.createElement('div'); t.className='tst '+tipo; t.textContent=msg; $('toast').appendChild(t); setTimeout(()=>t.remove(), tipo==='err'?6000:3200); }
function fallo(e){ console.error(e); toast(e.message || String(e), 'err'); }

/* Número a letras (pesos colombianos) */
const U=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
const DEC=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
const CEN=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
function tres(n){ if(n===100) return 'CIEN'; const c=Math.floor(n/100), r=n%100; let s=CEN[c];
  if(r) s += (s?' ':'') + (r<30 ? U[r] : DEC[Math.floor(r/10)] + (r%10 ? ' Y '+U[r%10] : '')); return s; }
function miles(n){ const m=Math.floor(n/1000), r=n%1000; let s=''; if(m) s = m===1 ? 'MIL' : tres(m)+' MIL'; if(r) s += (s?' ':'')+tres(r); return s; }
function letras(n){
  n = Math.round(Number(n)||0); if(!n) return 'CERO PESOS M/L';
  const mm = Math.floor(n/1e6), r = n%1e6; let s='';
  if(mm) s = mm===1 ? 'UN MILLÓN' : miles(mm)+' MILLONES';
  if(r) s += (s?' ':'') + miles(r); else if(mm) s += ' DE';
  return s + ' PESOS M/L';
}

/* ============================ AUTENTICACIÓN ============================ */
function guardarSesion(j){
  SES = { access_token:j.access_token, refresh_token:j.refresh_token,
          expira: Date.now() + ((j.expires_in||3600)-60)*1000, email:String(j.user?.email||'').toLowerCase() };
  localStorage.setItem('teo_ctr_sesion', JSON.stringify(SES));
}
async function authPost(path, body){
  const r = await fetch(CFG.URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:CFG.KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'No se pudo autenticar');
  return j;
}
async function asegurarSesion(){
  if(!SES) throw new Error('Sesión cerrada. Vuelve a entrar.');
  if(Date.now() < SES.expira) return;
  try{ guardarSesion(await authPost('token?grant_type=refresh_token',{refresh_token:SES.refresh_token})); }
  catch(e){ salir(); throw new Error('La sesión expiró. Vuelve a entrar.'); }
}
async function entrar(){
  const email=$('lg-email').value.trim(), pass=$('lg-pass').value;
  if(!email || !pass){ $('lg-msg').textContent='Escribe correo y contraseña.'; return; }
  $('lg-btn').disabled=true; $('lg-msg').textContent='Entrando…';
  try{ guardarSesion(await authPost('token?grant_type=password',{email,password:pass})); $('lg-msg').textContent=''; await iniciar(); }
  catch(e){ $('lg-msg').textContent = e.message.includes('Invalid') ? 'Correo o contraseña incorrectos.' : e.message; }
  finally{ $('lg-btn').disabled=false; }
}
async function recuperar(){
  const email=$('lg-email').value.trim();
  if(!email){ $('lg-msg').textContent='Escribe tu correo arriba y vuelve a pulsar.'; return; }
  try{ await authPost('recover',{email}); $('lg-msg').textContent='Te enviamos un correo para restablecer la contraseña.'; }
  catch(e){ $('lg-msg').textContent=e.message; }
}
function salir(){ SES=null; localStorage.removeItem('teo_ctr_sesion'); $('app').classList.add('oculto'); $('login').classList.remove('oculto'); cerrarModal(); }

/* ============================ API REST / STORAGE ============================ */
async function rest(path, {method='GET', body, prefer, range}={}){
  await asegurarSesion();
  const h = { apikey:CFG.KEY, Authorization:'Bearer '+SES.access_token };
  if(body !== undefined) h['Content-Type']='application/json';
  if(prefer) h.Prefer = prefer;
  if(range){ h['Range-Unit']='items'; h.Range=range; }
  const r = await fetch(CFG.URL+'/rest/v1/'+path, {method, headers:h, body: body!==undefined ? JSON.stringify(body) : undefined});
  const t = await r.text(); let j=null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok){
    const m = j?.message || j?.hint || ('Error '+r.status);
    if(/duplicate key/.test(m)) throw new Error('Ya existe un registro con esos datos (cédula repetida en la vigencia).');
    throw new Error(m);
  }
  return j;
}
/* Paginación estable: siempre ordenada por id único para no duplicar ni perder filas */
async function todos(tabla, q){
  const out=[];
  for(let i=0;;i+=1000){ const p = await rest(`${tabla}?${q}`,{range:`${i}-${i+999}`}); out.push(...p); if(p.length<1000) break; }
  return out;
}
async function subirArchivo(ruta, file){
  if(file.size > CFG.MAX_MB*1048576) throw new Error(`El archivo supera ${CFG.MAX_MB} MB.`);
  await asegurarSesion();
  const r = await fetch(`${CFG.URL}/storage/v1/object/${CFG.BUCKET}/${ruta}`,{method:'POST',
    headers:{apikey:CFG.KEY,Authorization:'Bearer '+SES.access_token,'x-upsert':'true','Content-Type':file.type||'application/pdf'},body:file});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message||j.error||'No se pudo subir el archivo'); }
  return ruta;
}
async function verArchivo(ruta){
  if(!ruta) return;
  const w = window.open('','_blank');
  try{
    await asegurarSesion();
    const r = await fetch(`${CFG.URL}/storage/v1/object/sign/${CFG.BUCKET}/${ruta}`,{method:'POST',
      headers:{apikey:CFG.KEY,Authorization:'Bearer '+SES.access_token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:600})});
    const j = await r.json(); if(!r.ok) throw new Error(j.message||'No se pudo abrir el archivo');
    w.location = CFG.URL+'/storage/v1'+j.signedURL;
  }catch(e){ w.close(); fallo(e); }
}
function rutaArchivo(cid, prefijo, file){
  const ext = (file.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  return `${cid}/${prefijo}_${Date.now()}.${ext}`;
}

/* ============================ CARGA DE DATOS ============================ */
async function cargarDatos(){
  const [req, perf] = await Promise.all([
    rest('ctr_requisitos?select=*&order=orden.asc,codigo.asc'),
    rest(`ctr_perfiles?select=*&email=ilike.${encodeURIComponent(SES.email)}`)
  ]);
  S.requisitos = req; S.perfil = perf[0] && perf[0].activo ? perf[0] : null;
  S.rol = S.perfil ? S.perfil.rol : 'contratista';
  const [con, docs, infs] = await Promise.all([
    todos('ctr_contratos','select=*&order=id.asc'),
    todos('ctr_documentos','select=id,contrato_id,requisito,ruta,nombre_archivo,fecha_expedicion,estado,observacion,subido_por,subido_en,revisado_por,revisado_en&order=id.asc'),
    todos('ctr_informes','select=*&order=id.asc')
  ]);
  S.contratos=con; S.documentos=docs; S.informes=infs;
}

/* ============================ CÁLCULOS ============================ */
const esStaff = () => S.rol==='admin' || S.rol==='revisor';
const contratosVig = () => S.contratos.filter(c=>c.vigencia===S.vigencia);
const porId = id => S.contratos.find(c=>c.id===id);
function reqsDe(c){ return S.requisitos.filter(r=>r.activo && (!r.aplica || !r.aplica.length || r.aplica.includes(c.perfil))); }
function docDe(cid, cod){ return S.documentos.find(d=>d.contrato_id===cid && d.requisito===cod); }
function venceEl(d, r){ if(!r.vigencia_dias || !d?.fecha_expedicion) return null; const x=new Date(d.fecha_expedicion+'T12:00:00'); x.setDate(x.getDate()+r.vigencia_dias); return x.toISOString().slice(0,10); }
function estadoReq(c, r){
  const d = docDe(c.id, r.codigo);
  if(!d) return 'falta';
  const v = venceEl(d, r);
  if(v && v < hoyISO() && IDX[c.etapa] <= IDX.minuta && d.estado!=='rechazado') return 'vencido';
  return d.estado;
}
const CHIP_DOC = {falta:['Falta','c-gris'],cargado:['Por revisar','c-info'],aprobado:['Aprobado','c-ok'],rechazado:['Devuelto','c-bad'],vencido:['Vencido','c-warn']};
function avance(c){
  const rs = reqsDe(c); const ob = rs.filter(r=>r.obligatorio);
  const est = rs.map(r=>[r, estadoReq(c,r)]);
  const n = k => est.filter(([r,e])=>e===k).length;
  const aprobOb = est.filter(([r,e])=>r.obligatorio && e==='aprobado').length;
  return { total:ob.length, aprob:aprobOb, cargados:n('cargado'), rechazados:n('rechazado'), vencidos:n('vencido'),
           faltan: est.filter(([r,e])=>r.obligatorio && e==='falta').length, pct: ob.length ? Math.round(aprobOb*100/ob.length) : 0,
           completo: ob.length>0 && aprobOb===ob.length };
}
function diasEnEtapa(c){ return diasDesde(c.fechas_etapa?.[c.etapa] || c.creado); }
function chipEtapa(c){ const i=IDX[c.etapa]??0; const d=diasEnEtapa(c); const atas = d>CFG.DIAS_ALERTA && c.etapa!=='ejecucion' && c.etapa!=='terminado';
  return `<span class="chip ${i>=8?'c-ok':'c-info'}">${esc(ETAPAS[i][1])}</span> <span class="sub" style="color:${atas?'var(--bad)':''}">${d??0} d</span>`; }
function siguienteNumeroInforme(cid){ const ns=S.informes.filter(i=>i.contrato_id===cid).map(i=>i.numero); return ns.length?Math.max(...ns)+1:1; }

/* ============================ ETAPAS ============================ */
async function moverEtapa(c, etapa, silencioso){
  const fe = {...(c.fechas_etapa||{}), [etapa]: new Date().toISOString()};
  const [n] = await rest(`ctr_contratos?id=eq.${c.id}`,{method:'PATCH',body:{etapa,fechas_etapa:fe},prefer:'return=representation'});
  Object.assign(c, n);
  await bitacora(c.id,'Cambio de etapa',`${ETAPAS[IDX[c.etapa]][1]}`);
  if(!silencioso) toast(`Etapa: ${ETAPAS[IDX[etapa]][1]}`,'ok');
}
async function clicEtapa(cid, etapa){
  const c=porId(cid); if(c.etapa===etapa) return;
  if(etapa==='revision' && !avance(c).completo && !confirm('Aún faltan documentos obligatorios aprobados. ¿Pasar a revisión de todas formas?')) return;
  if(IDX[etapa]>=IDX.cdp && !c.valor_total && !confirm('El contrato no tiene valor registrado. ¿Continuar?')) return;
  if(etapa==='acta' && (!c.rp) && !confirm('No hay registro presupuestal (RP) anotado. ¿Continuar?')) return;
  try{ await moverEtapa(c, etapa); abrirContrato(cid, S.subtab); pintar(); }catch(e){ fallo(e); }
}
function pasos(c, editable){
  const i = IDX[c.etapa];
  return `<div class="pasos">${ETAPAS.map(([k,l],j)=>{ const cl = j<i?'hecho':(j===i?'actual':'');
    return editable ? `<button class="paso ${cl}" onclick="clicEtapa('${c.id}','${k}')" title="Mover a: ${l}">${l}</button>` : `<div class="paso ${cl}">${l}</div>`; }).join('')}</div>`;
}

/* ============================ DETALLE DEL CONTRATO ============================ */
function abrirContrato(id, sub){
  const c = porId(id); if(!c) return;

async function revisarDoc(docId, estado){
  let obs = null;
  if(estado==='rechazado'){ obs = await pedirTexto('Devolver documento','Explica al contratista qué debe corregir. Lo verá en su portal.'); if(!obs) return; }
  try{
    const [n] = await rest(`ctr_documentos?id=eq.${docId}`,{method:'PATCH',prefer:'return=representation',
      body:{estado, observacion:obs, revisado_por:SES.email, revisado_en:new Date().toISOString()}});
    Object.assign(S.documentos.find(d=>d.id===docId), n);
    await bitacora(n.contrato_id, estado==='aprobado'?'Documento aprobado':'Documento devuelto', `${n.requisito}${obs?': '+obs:''}`);
    toast(estado==='aprobado'?'Documento aprobado':'Documento devuelto al contratista','ok');
    if(S.detalle) abrirContrato(S.detalle, S.subtab); if(S.tab==='revision' && !S.detalle) pintar(); else pintar();
  }catch(e){ fallo(e); }
}
async function aprobarTodos(cid){
  const ids = S.documentos.filter(d=>d.contrato_id===cid && d.estado==='cargado').map(d=>d.id);
  if(!ids.length || !confirm(`¿Aprobar ${ids.length} documentos?`)) return;
  try{
    const ns = await rest(`ctr_documentos?id=in.(${ids.join(',')})`,{method:'PATCH',prefer:'return=representation',body:{estado:'aprobado',observacion:null,revisado_por:SES.email,revisado_en:new Date().toISOString()}});
    ns.forEach(n=>Object.assign(S.documentos.find(d=>d.id===n.id),n));
    await bitacora(cid,'Documentos aprobados en bloque',`${ids.length} documentos`);
    toast('Documentos aprobados','ok'); abrirContrato(cid,'docs'); pintar();
  }catch(e){ fallo(e); }
}
async function subirDoc(cid, codigo, file, fechaExp, desdeStaff){
  if(!file) return;
  const r = S.requisitos.find(x=>x.codigo===codigo);
  if(r?.vigencia_dias && !fechaExp){
    fechaExp = await pedirTexto('Fecha de expedición', `Este documento vence a los ${r.vigencia_dias} días. Escribe la fecha de expedición (AAAA-MM-DD).`, hoyISO());
    if(!fechaExp) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fechaExp)) return toast('La fecha debe tener el formato AAAA-MM-DD.','err');
  }
  toast('Subiendo archivo…');
  try{
    const ruta = await subirArchivo(rutaArchivo(cid, codigo, file), file);
    const [n] = await rest('ctr_documentos?on_conflict=contrato_id,requisito',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',
      body:{contrato_id:cid, requisito:codigo, ruta, nombre_archivo:file.name, fecha_expedicion:fechaExp||null, estado:'cargado', observacion:null, subido_por:SES.email, subido_en:new Date().toISOString(), revisado_por:null, revisado_en:null}});
    const i = S.documentos.findIndex(d=>d.id===n.id); if(i>=0) S.documentos[i]=n; else S.documentos.push(n);
    await bitacora(cid,'Documento cargado',`${r?.nombre||codigo}${desdeStaff?' (por el equipo)':''}`);
    toast('Documento cargado','ok');
    if(esStaff()){ abrirContrato(cid,'docs'); pintar(); } else pintarPortal();
  }catch(e){ fallo(e); }
}

function formCampos(c, soloContratista){
  return CAMPOS.map(([titulo, cs])=>{
    const vis = cs.filter(([k])=>!soloContratista || CAMPOS_CONTRATISTA.includes(k)); if(!vis.length) return '';
    return `<h3 style="margin:14px 0 8px">${titulo}</h3><div class="grid g3">${vis.map(([k,l,t])=>{
      const v = c[k] ?? '';
      if(t==='area') return `<label class="f spanall">${l}<textarea data-k="${k}" rows="${k==='obligaciones'?6:3}">${esc(v)}</textarea></label>`;
      if(t==='perfil') return `<label class="f">${l}<select data-k="${k}">${Object.entries(PERFILES).map(([p,n])=>`<option value="${p}" ${v===p?'selected':''}>${n}</option>`).join('')}</select></label>`;
      return `<label class="f">${l}<input data-k="${k}" type="${t||'text'}" value="${esc(v)}" ${t==='number'?'step="any"':''}></label>`;
    }).join('')}</div>`;
  }).join('');
}
function leerForm(cont){
  const o={}; cont.querySelectorAll('[data-k]').forEach(el=>{ let v=el.value.trim(); const t=el.type;
    if(t==='number') v = v===''?null:Number(v); else if(v==='') v=null; o[el.dataset.k]=v; });
  if(o.email) o.email=o.email.toLowerCase(); return o;
}
function enlazarCalculos(cont){
  const g=k=>cont.querySelector(`[data-k="${k}"]`); if(!g('valor_mensual')) return;
  const calc=()=>{ const m=Number(g('valor_mensual').value)||0, p=Number(g('plazo_meses').value)||0;
    if(m&&p) g('valor_total').value=Math.round(m*p); const f=sumarMeses(g('fecha_inicio').value,p); if(f) g('fecha_fin').value=f; };
  ['valor_mensual','plazo_meses','fecha_inicio'].forEach(k=>g(k).addEventListener('input',calc));
}

  $('det-cuerpo').innerHTML = `<div id="f-datos">${formCampos(c)}</div>

function previaMasivo(){
  const txt = $('masivo').value.trim(); const box=$('masivo-previa'); PREVIA=[];
  if(!txt){ box.innerHTML=''; return; }
  const existentes = new Set(contratosVig().map(c=>String(c.cedula)));
  const vistas = new Set();
  txt.split(/\r?\n/).forEach((linea,n)=>{
    const p = linea.split(/\t|;/).map(x=>x.trim()); if(!p.join('')) return;
    if(n===0 && /c[eé]dula/i.test(p[0])) return;
    const o = {}; COLS_MASIVO.forEach((k,i)=>o[k]=p[i]||'');
    o.cedula = o.cedula.replace(/\D/g,''); o.email=o.email.toLowerCase(); o.perfil = (o.perfil||'profesional').toLowerCase().replace('técnico','tecnico');
    o.valor_mensual = Number(String(o.valor_mensual).replace(/[^\d]/g,''))||0; o.plazo_meses = Number(String(o.plazo_meses).replace(',','.'))||0;
    const err=[];
    if(!o.cedula) err.push('sin cédula'); if(!o.nombre) err.push('sin nombre');
    if(!/^\S+@\S+\.\S+$/.test(o.email)) err.push('correo inválido');
    if(!PERFILES[o.perfil]) err.push('perfil inválido');
    if(o.fecha_inicio && !/^\d{4}-\d{2}-\d{2}$/.test(o.fecha_inicio)) err.push('fecha inválida');
    if(existentes.has(o.cedula)) err.push('ya existe en la vigencia');
    if(vistas.has(o.cedula)) err.push('repetida en lo pegado'); vistas.add(o.cedula);
    PREVIA.push({o, err});
  });
  const ok = PREVIA.filter(x=>!x.err.length).length;
  box.innerHTML = `<div class="tabla-w"><table class="t"><thead><tr><th>Cédula</th><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Mensual</th><th>Meses</th><th>Validación</th></tr></thead><tbody>
    ${PREVIA.map(({o,err})=>`<tr><td>${esc(o.cedula)}</td><td>${esc(o.nombre)}</td><td class="sub">${esc(o.email)}</td><td>${esc(o.perfil)}</td><td>${cop(o.valor_mensual)}</td><td>${o.plazo_meses}</td>
    <td>${err.length?`<span class="chip c-bad">${esc(err.join(', '))}</span>`:'<span class="chip c-ok">Lista</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="fila entre" style="margin-top:10px"><span class="sub">${ok} de ${PREVIA.length} filas se crearán</span><button class="btn btn-p" ${ok?'':'disabled'} onclick="crearMasivo()">Crear ${ok} contratos</button></div>`;
}
async function crearMasivo(){
  const filas = PREVIA.filter(x=>!x.err.length).map(({o})=>({...o, fecha_inicio:o.fecha_inicio||null, vigencia:S.vigencia,
    valor_total: Math.round(o.valor_mensual*o.plazo_meses), fecha_fin: sumarMeses(o.fecha_inicio,o.plazo_meses),
    dependencia:CFG.DEPENDENCIA, etapa:'documentos', fechas_etapa:{documentos:new Date().toISOString()}, creado_por:SES.email}));
  if(!filas.length) return;
  try{ const ns = await rest('ctr_contratos?on_conflict=vigencia,cedula',{method:'POST',body:filas,prefer:'resolution=ignore-duplicates,return=representation'});
    S.contratos.push(...ns); for(const n of ns) await bitacora(n.id,'Contrato creado (cargue masivo)');
    toast(`${ns.length} contratos creados`,'ok'); $('masivo').value=''; PREVIA=[]; S.tab='contratos'; S.filtroEtapa='documentos'; pintar(); }catch(e){ fallo(e); }
}
function listarRenovables(){
  const origen = Number($('ren-origen').value); const yaEstan = new Set(contratosVig().map(c=>String(c.cedula)));
  const cs = S.contratos.filter(c=>c.vigencia===origen && !yaEstan.has(String(c.cedula))).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  $('ren-lista').innerHTML = cs.length ? `<div class="tabla-w" style="max-height:380px;overflow:auto"><table class="t"><thead><tr><th><input type="checkbox" style="width:auto" checked onchange="document.querySelectorAll('.ren-ck').forEach(x=>x.checked=this.checked)"></th><th>Contratista</th><th>Objeto</th><th>Mensual</th></tr></thead><tbody>
    ${cs.map(c=>`<tr><td><input type="checkbox" class="ren-ck" value="${c.id}" style="width:auto" checked></td><td><div class="nombre">${esc(c.nombre)}</div><div class="sub">CC ${esc(c.cedula)}</div></td><td class="sub">${esc((c.objeto||'').slice(0,110))}</td><td>${cop(c.valor_mensual)}</td></tr>`).join('')}</tbody></table></div>
    <div class="fila" style="justify-content:flex-end;margin-top:10px"><button class="btn btn-p" onclick="renovar()">Renovar seleccionados en ${S.vigencia}</button></div>`
    : `<p class="mute">Todos los contratistas de ${origen} ya tienen contrato en ${S.vigencia}.</p>`;
}
async function renovar(){
  const ids = [...document.querySelectorAll('.ren-ck:checked')].map(x=>x.value); if(!ids.length) return toast('Selecciona al menos un contratista.','err');
  const conValor = $('ren-valor').checked, conDocs = $('ren-docs').checked;
  const COPIAR = ['cedula','nombre','email','telefono','direccion','profesion','banco','tipo_cuenta','num_cuenta','eps','afp','arl','perfil','objeto','obligaciones','supervisor','dependencia','riesgo_arl','rubro'];
  const filas = ids.map(id=>{ const c=porId(id); const o={}; COPIAR.forEach(k=>o[k]=c[k]);
    if(conValor){ o.valor_mensual=c.valor_mensual; o.plazo_meses=c.plazo_meses; o.valor_total=c.valor_total; }
    return {...o, vigencia:S.vigencia, etapa:'documentos', fechas_etapa:{documentos:new Date().toISOString()}, creado_por:SES.email, notas:`Renovado desde ${c.vigencia}`}; });
  if(!confirm(`¿Crear ${filas.length} contratos en ${S.vigencia}?`)) return;
  try{
    const ns = await rest('ctr_contratos?on_conflict=vigencia,cedula',{method:'POST',body:filas,prefer:'resolution=ignore-duplicates,return=representation'});
    S.contratos.push(...ns); let copiados=0;
    if(conDocs){
      const reut = new Set(S.requisitos.filter(r=>r.reutilizable).map(r=>r.codigo)); const docs=[];
      for(const n of ns){ const viejo = S.contratos.find(c=>ids.includes(c.id) && String(c.cedula)===String(n.cedula));
        S.documentos.filter(d=>d.contrato_id===viejo?.id && d.estado==='aprobado' && reut.has(d.requisito)).forEach(d=>docs.push({contrato_id:n.id,requisito:d.requisito,ruta:d.ruta,nombre_archivo:d.nombre_archivo,fecha_expedicion:d.fecha_expedicion,estado:'aprobado',observacion:'Reutilizado de la vigencia anterior',subido_por:d.subido_por,subido_en:d.subido_en,revisado_por:SES.email,revisado_en:new Date().toISOString()})); }
      for(let i=0;i<docs.length;i+=200){ const r = await rest('ctr_documentos?on_conflict=contrato_id,requisito',{method:'POST',body:docs.slice(i,i+200),prefer:'resolution=ignore-duplicates,return=representation'}); S.documentos.push(...r); copiados+=r.length; }
    }
    for(const n of ns) await bitacora(n.id,'Contrato renovado', n.notas);
    toast(`${ns.length} contratos renovados${conDocs?`, ${copiados} documentos reutilizados`:''}`,'ok'); S.tab='contratos'; S.filtroEtapa='documentos'; pintar();
  }catch(e){ fallo(e); }
}

    <label class="f">Planilla de seguridad social pagada (PDF)${i?.planilla_ruta?' <span class="chip c-ok">ya cargada</span>':''}<input id="in-fpla" type="file" accept=".pdf,image/*"></label>
    <label class="f">Evidencias en un solo PDF (opcional)${i?.evidencias_ruta?' <span class="chip c-ok">ya cargadas</span>':''}<input id="in-fev" type="file" accept=".pdf"></label>
    <div class="fila spanall" style="justify-content:flex-end"><button class="btn" onclick="guardarInforme('${cid}','${iid||''}',${num},'borrador')">Guardar borrador</button>
    <button class="btn btn-p" onclick="guardarInforme('${cid}','${iid||''}',${num},'radicado')">Radicar al supervisor</button></div>
  </div>`);
}
async function guardarInforme(cid, iid, num, estado){
  const prev = iid ? S.informes.find(x=>x.id===iid) : null;
  const o = { contrato_id:cid, numero:num, periodo_inicio:$('in-ini').value||null, periodo_fin:$('in-fin').value||null,
    valor:Number($('in-val').value)||0, actividades:$('in-act').value, planilla_numero:$('in-pla').value.trim()||null, estado };
  const fp=$('in-fpla').files[0], fe=$('in-fev').files[0];
  if(estado==='radicado'){
    if(!o.periodo_inicio || !o.periodo_fin) return toast('Indica el periodo del informe.','err');
    if(!fp && !prev?.planilla_ruta) return toast('Adjunta la planilla de seguridad social pagada para radicar.','err');
    if(!o.planilla_numero) return toast('Escribe el número de la planilla.','err');
  }
  try{
    if(fp) o.planilla_ruta = await subirArchivo(rutaArchivo(cid,`informe${num}_planilla`,fp),fp);
    if(fe) o.evidencias_ruta = await subirArchivo(rutaArchivo(cid,`informe${num}_evidencias`,fe),fe);
    let n;
    if(iid) [n] = await rest(`ctr_informes?id=eq.${iid}`,{method:'PATCH',body:o,prefer:'return=representation'});
    else [n] = await rest('ctr_informes',{method:'POST',body:o,prefer:'return=representation'});
    const k=S.informes.findIndex(x=>x.id===n.id); if(k>=0) S.informes[k]=n; else S.informes.push(n);
    await bitacora(cid, estado==='radicado'?`Informe ${num} radicado`:`Informe ${num} guardado`);
    toast(estado==='radicado'?'Informe radicado al supervisor':'Borrador guardado','ok'); cerrarModal(); pintar();
  }catch(e){ fallo(e); }
}
function bajarInforme(iid){ const i=S.informes.find(x=>x.id===iid), c=porId(i.contrato_id); descargarWord(`informe_${i.numero}_${c.cedula}`, tplInforme(c,i)); }
